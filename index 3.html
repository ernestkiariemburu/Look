<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ernest Kiarie — Drawings</title>
<style>
:root{--bg:#f6f3ee;--fg:#1c1b19;--muted:#76706a;--line:#ddd7cf;--card:#fff;--accent:#8c2f2a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--fg:#efebe5;--muted:#9b948c;--line:#2d2b28;--card:#1d1c1a;--accent:#d9806f}}
:root[data-theme="dark"]{--bg:#141413;--fg:#efebe5;--muted:#9b948c;--line:#2d2b28;--card:#1d1c1a;--accent:#d9806f}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif;line-height:1.6}
.sans{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px 20px;justify-content:space-between;align-items:center;padding:22px 5vw;max-width:1200px;margin:auto}
.logo{white-space:nowrap;font-size:1.3rem;letter-spacing:.04em;text-decoration:none;color:var(--fg)}
nav a{margin-left:20px;color:var(--muted);text-decoration:none;font-size:.85rem;letter-spacing:.12em;text-transform:uppercase}
nav a:hover{color:var(--accent)}
.hero{max-width:1200px;margin:auto;padding:9vh 5vw 6vh}
.hero h1{font-size:clamp(2.4rem,7vw,5rem);font-weight:400;line-height:1.05;margin:0 0 18px;max-width:14ch}
.hero p{max-width:46ch;color:var(--muted);font-size:1.1rem;margin:0}
section{max-width:1200px;margin:auto;padding:5vh 5vw}
h2{font-weight:400;font-size:1.6rem;margin:0 0 20px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.filters button{font:inherit;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;background:none;border:1px solid var(--line);color:var(--muted);padding:7px 15px;border-radius:99px;cursor:pointer}
.filters button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{columns:3 260px;column-gap:22px}
.card{break-inside:avoid;margin:0 0 22px;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:transform .2s}
.card:hover{transform:translateY(-3px)}
.art{width:100%;display:block;aspect-ratio:var(--r,4/5);object-fit:cover;background:var(--ph,#c9c2b8)}
.ph{display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.75);font-style:italic;text-align:center;padding:12px}
.meta{padding:12px 14px 14px}
.meta b{font-weight:400;font-size:1.05rem}
.meta small{display:block;color:var(--muted);font-size:.78rem;letter-spacing:.04em}
.tag{display:inline-block;margin-top:6px;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);padding:1px 8px;border-radius:99px}
.about{display:grid;grid-template-columns:1fr 1fr;gap:6vw;align-items:start}
.about p{margin:0 0 1em;color:var(--muted)}
.contact a{color:var(--accent)}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:40px 5vw 50px;border-top:1px solid var(--line);margin-top:6vh}
#lb{position:fixed;inset:0;background:rgba(10,10,10,.92);display:none;z-index:20;padding:5vh 5vw;overflow:auto}
#lb.open{display:block}
#lb .in{max-width:900px;margin:auto;color:#eee}
#lb .art{object-fit:contain;max-height:70vh;width:auto;max-width:100%;margin:auto}
#lb h3{font-weight:400;font-size:1.6rem;margin:16px 0 4px}
#lb p{color:#bbb;margin:6px 0}
#lb .x{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:18px;font-size:2rem;background:none;border:0;color:#fff;cursor:pointer}
h3{font-weight:400;font-size:1.15rem;margin:0 0 10px}
.pay{list-style:none;padding:0;margin:0;color:var(--muted)}
.pay li{margin:0 0 10px}
.pay a{color:var(--accent)}
.buy{display:inline-block;background:#e9a89b;color:#1c1b19;padding:9px 20px;border-radius:99px;text-decoration:none;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase}
@media(max-width:700px){.about{grid-template-columns:1fr}nav{width:100%}nav a{margin:0 14px 0 0}}
</style>
</head>
<body>

<header class="sans">
  <a class="logo" href="#top" id="siteName"></a>
  <nav><a href="#work">Work</a><a href="#about">About</a><a href="#buy">Buying</a><a href="#contact">Contact</a></nav>
</header>

<div class="hero" id="top">
  <h1 id="heroTitle"></h1>
  <p id="heroText"></p>
</div>

<section id="work">
  <h2>Selected work</h2>
  <div class="filters sans" id="filters"></div>
  <div class="grid" id="grid"></div>
</section>

<section id="about">
  <div class="about">
    <div><h2>About</h2></div>
    <div id="aboutText"></div>
  </div>
</section>

<section id="buy">
  <h2>Buying &amp; shipping</h2>
  <div class="about">
    <div><h3>Payment</h3><ul class="pay sans" id="payList"></ul></div>
    <div><h3>Shipping</h3><p id="shipText"></p></div>
  </div>
</section>

<section id="contact" class="contact">
  <h2>Commissions &amp; enquiries</h2>
  <p id="contactText" style="color:var(--muted);max-width:50ch"></p>
  <p class="sans" id="contactLinks"></p>
</section>

<footer class="sans" id="foot"></footer>

<div id="lb" role="dialog" aria-modal="true"><button class="x" id="close" aria-label="Close">&times;</button><div class="in" id="lbIn"></div></div>

<script>
/* ================================================================
   EDIT HERE — everything on the site comes from this block.
   ================================================================ */
const SITE = {
  name: "Ernest Kiarie",
  brand: "Look",
  logo: "",                        // your Look logo image goes here once it is digitised
  heroTitle: "Portraits and studies in graphite.",
  heroText: "Quiet, detailed portraits and studies — made slowly, by hand.",
  about: [
    "I’m Ernest Kiarie, the artist behind Look. I work mostly in graphite, with touches of charcoal, pen, coloured pencil and watercolor. I'm drawn to faces, gesture and the small moments people don't notice they're having.",
    "Each piece takes many hours. Originals and limited prints are available.",
    "The Look mark on my drawings is my signature: a sign that the work is original and made by me."
  ],
  contactText: "Interested in an original, a print, or a commission? Get in touch.",
  email: "ernestdrawings@gmail.com",
  instagram: "",                    // e.g. "https://instagram.com/yourname" (leave "" to hide)
  payments: {                       // paste your links here once your accounts are ready; blank ones stay hidden
    paypal: "",                   // e.g. "https://paypal.me/yourname"
    stripe: "",                   // e.g. a Stripe Payment Link
    zelle: "",                    // email or phone linked to Zelle (US only)
    crypto: false,                // true shows "Crypto accepted on request"
    shipping: "Shipped worldwide, flat-packed or rolled with tracking and insurance. Shipping is quoted per country before payment. Buyers cover any customs duties or import taxes."
  },
  year: new Date().getFullYear()
};

/* Add a piece = add a block. "image" can be a file name uploaded next to this page,
   or left "" to show an elegant placeholder. status: "Available", "Sold", "In progress", or "".
   Optional per piece: payLink:"https://..." shows a Buy now button (hidden when Sold). */
const ARTWORKS = [
  { title:"The Moon", year:"", medium:"Graphite", size:"", image:"moon.jpg", ratio:"1512/2016", status:"Available",
    desc:"", color:"#6d675f" },
  { title:"The Girl with the Curls", year:"", medium:"Coloured pencil", size:"", image:"curls.jpg", ratio:"1450/2132", status:"Available",
    desc:"", color:"#6d675f" },
  { title:"My Sister’s Drawing", year:"", medium:"Graphite", size:"", image:"sister.jpg", ratio:"988/1530", status:"Sold",
    desc:"", color:"#6d675f" },
  { title:"Yellow is a Primary Colour", year:"", medium:"Watercolor", size:"", image:"cubist.jpg", ratio:"1932/2576", status:"Available",
    desc:"", color:"#6d675f" },
  { title:"Portrait of Elvis Kimathi", year:"", medium:"Graphite", size:"", image:"elvis.jpg", ratio:"2320/1540", status:"Sold",
    desc:"", color:"#6d675f" },
  { title:"Portrait of Margaret", year:"", medium:"Graphite", size:"", image:"margaret.jpg", ratio:"793/1510", status:"Sold",
    desc:"", color:"#6d675f" },
  { title:"Sight Unseen", year:"", medium:"Graphite", size:"", image:"sight.jpg", ratio:"784/950", status:"Available",
    desc:"", color:"#6d675f" },
  { title:"Piranha 3DD Cover Drawing", year:"", medium:"Pen", size:"", image:"piranha.jpg", ratio:"2244/1683", status:"Available",
    desc:"", color:"#6d675f" }
];
/* ================================================================ */

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

document.title = SITE.brand + " by " + SITE.name + " — Drawings";
$("siteName").innerHTML = (SITE.logo ? '<img src="' + esc(SITE.logo) + '" alt="' + esc(SITE.brand) + '" style="height:34px;vertical-align:middle">' : esc(SITE.brand)) + ' <small class="sans" style="font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-left:8px">by ' + esc(SITE.name) + '</small>';
$("heroTitle").textContent = SITE.heroTitle;
$("heroText").textContent = SITE.heroText;
$("aboutText").innerHTML = SITE.about.map(p => "<p>" + esc(p) + "</p>").join("");
$("contactText").textContent = SITE.contactText;
$("contactLinks").innerHTML = (SITE.email ? '<a href="mailto:' + esc(SITE.email) + '">' + esc(SITE.email) + "</a>" : "") +
  (SITE.instagram ? ' &nbsp;·&nbsp; <a href="' + esc(SITE.instagram) + '" target="_blank" rel="noopener">Instagram</a>' : "");
$("foot").textContent = "© " + SITE.year + " " + SITE.brand + " · " + SITE.name + ". All artwork is copyrighted; please don’t reproduce without permission.";

function artEl(a, cls){
  const style = "--r:" + (a.ratio || "4/5") + ";--ph:" + (a.color || "#c9c2b8");
  return a.image
    ? '<img class="art ' + cls + '" style="' + style + '" src="' + esc(a.image) + '" alt="' + esc(a.title) + '" loading="lazy">'
    : '<div class="art ph ' + cls + '" style="' + style + '">' + esc(a.title) + "</div>";
}

let current = "All";
function render(){
  const media = ["All", ...new Set(ARTWORKS.map(a => a.medium).filter(Boolean)), ...(ARTWORKS.some(a => a.status === "Sold") ? ["Sold"] : [])];
  $("filters").innerHTML = media.map(m => '<button class="' + (m === current ? "on" : "") + '" data-m="' + esc(m) + '">' + esc(m) + "</button>").join("");
  const list = ARTWORKS.map((a, i) => ({a, i})).filter(o => current === "All" || (current === "Sold" ? o.a.status === "Sold" : o.a.medium === current));
  $("grid").innerHTML = list.map(o =>
    '<figure class="card" data-i="' + o.i + '">' + artEl(o.a, "") +
    '<div class="meta"><b>' + esc(o.a.title) + "</b><small class='sans'>" + esc([o.a.medium, o.a.size, o.a.year].filter(Boolean).join(" · ")) + "</small>" +
    (o.a.status ? '<span class="tag sans">' + esc(o.a.status) + "</span>" : "") + "</div></figure>").join("");
}
$("filters").addEventListener("click", e => { const m = e.target.dataset.m; if(m){ current = m; render(); } });
$("grid").addEventListener("click", e => { const c = e.target.closest(".card"); if(c) openLb(+c.dataset.i); });

function openLb(i){
  const a = ARTWORKS[i];
  $("lbIn").innerHTML = artEl(a, "") + "<h3>" + esc(a.title) + "</h3><p class='sans'>" +
    esc([a.medium, a.size, a.year].filter(Boolean).join(" · ")) + (a.status ? " — " + esc(a.status) : "") + "</p><p>" + esc(a.desc) + "</p>" +
    (a.payLink && a.status !== "Sold" ? '<p class="sans"><a class="buy" href="' + esc(a.payLink) + '" target="_blank" rel="noopener">Buy now</a></p>' : "") + (SITE.email ? '<p class="sans"><a style="color:#e9a89b" href="mailto:' + esc(SITE.email) + "?subject=" + encodeURIComponent("Enquiry: " + a.title) + '">Enquire about this piece</a></p>' : "");
  $("lb").classList.add("open");
}
const closeLb = () => $("lb").classList.remove("open");
$("close").onclick = closeLb;
$("lb").addEventListener("click", e => { if(e.target.id === "lb") closeLb(); });
document.addEventListener("keydown", e => { if(e.key === "Escape") closeLb(); });

(function(){
  const P = SITE.payments, rows = [];
  if(P.paypal) rows.push('<li><b>PayPal</b> — <a href="' + esc(P.paypal) + '" target="_blank" rel="noopener">pay with PayPal</a></li>');
  if(P.stripe) rows.push('<li><b>Card</b> — <a href="' + esc(P.stripe) + '" target="_blank" rel="noopener">pay by card (Stripe)</a></li>');
  if(P.zelle) rows.push('<li><b>Zelle</b> (US only) — ' + esc(P.zelle) + '</li>');
  if(P.crypto) rows.push('<li><b>Crypto</b> — accepted on request</li>');
  $("payList").innerHTML = rows.length ? rows.join("") : '<li>Message me about any piece and I’ll send a secure payment invoice.</li>';
  $("shipText").textContent = P.shipping;
})();
render();
</script>
</body>
</html>
